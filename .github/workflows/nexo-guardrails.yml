name: Nexo distribution guardrails

on:
  pull_request:
  push:
    branches:
      - codex/chatwoot-pipelines
      - 'release/nexo-*'
    tags:
      - 'v*-nexo.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  distribution-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: bash -n script/nexo/validate_distribution_guardrails.sh

      - name: Validate version and license boundaries
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: script/nexo/validate_distribution_guardrails.sh

  pipelines-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: --entrypoint valkey-server
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Create test database
        run: bundle exec rake db:create db:schema:load

      - name: Lint Pipelines backend
        run: |
          bundle exec rubocop \
            app/controllers/api/v1/accounts/pipeline*_controller.rb \
            app/models/pipeline*.rb \
            app/policies/pipeline*_policy.rb \
            app/services/pipelines \
            app/jobs/pipelines \
            app/listeners/pipelines \
            db/migrate/*pipeline*.rb \
            lib/events/types.rb \
            spec/factories/pipeline*.rb \
            spec/models/pipeline*_spec.rb \
            spec/policies/pipeline*_policy_spec.rb \
            spec/requests/api/v1/accounts/pipeline*_spec.rb \
            spec/services/pipelines \
            spec/jobs/pipelines \
            spec/listeners/pipelines \
            spec/listeners/action_cable_listener_spec.rb

      - name: Run Pipelines backend specs
        run: |
          bundle exec rspec \
            spec/models/pipeline*_spec.rb \
            spec/policies/pipeline*_policy_spec.rb \
            spec/requests/api/v1/accounts/pipeline*_spec.rb \
            spec/services/pipelines \
            spec/jobs/pipelines \
            spec/listeners/pipelines \
            spec/listeners/action_cable_listener_spec.rb

  pipelines-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Pipelines frontend
        run: |
          pnpm exec eslint \
            app/javascript/dashboard/api/pipeline*.js \
            app/javascript/dashboard/api/specs/pipeline*.spec.js \
            app/javascript/dashboard/components/widgets/conversation/pipelines \
            app/javascript/dashboard/composables/useUISettings.js \
            app/javascript/dashboard/helper/actionCable.js \
            app/javascript/dashboard/helper/specs/actionCable.spec.js \
            app/javascript/dashboard/routes/dashboard/conversation/ContactPanel.vue \
            app/javascript/dashboard/routes/dashboard/pipelines \
            app/javascript/dashboard/routes/dashboard/settings/pipelines \
            app/javascript/shared/constants/busEvents.js

      - name: Run Pipelines frontend specs
        run: |
          pnpm exec vitest run \
            --no-cache \
            --no-coverage \
            app/javascript/dashboard/api/specs/pipelineIntakeRules.spec.js \
            app/javascript/dashboard/api/specs/pipelineAutomationRules.spec.js \
            app/javascript/dashboard/api/specs/pipelineActivities.spec.js \
            app/javascript/dashboard/api/specs/pipelineFieldDefinitions.spec.js \
            app/javascript/dashboard/api/specs/pipelineItems.spec.js \
            app/javascript/dashboard/api/specs/pipelineStages.spec.js \
            app/javascript/dashboard/api/specs/pipelines.spec.js \
            app/javascript/dashboard/components/widgets/conversation/pipelines/specs/PipelineItemsList.spec.js \
            app/javascript/dashboard/helper/specs/actionCable.spec.js \
            app/javascript/dashboard/routes/dashboard/pipelines/components/specs/PipelineItemTable.spec.js \
            app/javascript/dashboard/routes/dashboard/pipelines/components/specs/PipelineItemDetails.spec.js \
            app/javascript/dashboard/routes/dashboard/pipelines/components/specs/PipelineWorkspaceToolbar.spec.js \
            app/javascript/dashboard/routes/dashboard/pipelines/helpers/activities.spec.js \
            app/javascript/dashboard/routes/dashboard/pipelines/helpers/board.spec.js \
            app/javascript/dashboard/routes/dashboard/pipelines/helpers/customFields.spec.js \
            app/javascript/dashboard/routes/dashboard/pipelines/helpers/workspace.spec.js \
            app/javascript/dashboard/routes/dashboard/settings/pipelines/helpers/intakeRuleForm.spec.js \
            app/javascript/dashboard/routes/dashboard/settings/pipelines/helpers/automationRuleForm.spec.js \
            app/javascript/dashboard/routes/dashboard/settings/pipelines/helpers/pipelineForm.spec.js
